<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bitnikgames CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dferreiramarques/bitnikgames-design-system@main/src/index.css">
<style>
  body { padding: 0; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
    background: var(--color-white);
  }
  header.top h1 { font-family: var(--font-display); font-size: 1.15rem; }
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }

  .tabs { display: flex; gap: 0.4rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .tab-btn {
    font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
    padding: 0.5rem 1rem; border-radius: var(--radius-pill);
    border: 1.5px solid var(--border); background: var(--color-white); color: var(--text-muted);
    cursor: pointer;
  }
  .tab-btn.active { background: var(--brand-primary); border-color: var(--brand-primary); color: var(--color-white); }

  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
  .entry-row {
    display: flex; align-items: center; gap: 0.8rem;
    background: var(--color-white); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.7rem 1rem; margin-bottom: 0.5rem;
  }
  .entry-row .slug { font-family: var(--font-display); font-weight: 600; flex: 1; }
  .entry-row .slug small { display: block; font-family: var(--font-body); font-weight: 400; color: var(--text-muted); font-size: 0.78rem; }
  .warn-badge { color: var(--color-brick-deep); font-size: 0.75rem; font-weight: 600; }
  .featured-badge { color: var(--brand-primary); font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
  .entry-row[draggable="true"] { cursor: grab; }
  .entry-row.dragging { opacity: 0.4; }
  .drag-handle { color: var(--text-muted); font-size: 1.1rem; line-height: 1; cursor: grab; flex-shrink: 0; }
  .order-hint { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.6rem; }

  .featured-row {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;
    padding: 0.6rem 0.9rem; background: var(--bg-alt); border: 1px solid var(--border);
    border-radius: var(--radius-sm); width: fit-content;
  }
  .featured-row label { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; cursor: pointer; }
  .featured-row input { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: var(--brand-primary); }

  .editor-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  @media (max-width: 720px) { .editor-panes { grid-template-columns: 1fr; } }
  .pane label { display: block; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; margin-bottom: 0.4rem; }
  .pane textarea {
    width: 100%; min-height: 420px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 0.82rem; line-height: 1.5; padding: 0.8rem; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg-alt); color: var(--text); resize: vertical;
  }
  .editor-actions { display: flex; gap: 0.6rem; align-items: center; }
  .slug-row { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .slug-row input {
    padding: 0.6rem 0.8rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-family: var(--font-body); background: var(--color-white); min-width: 240px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
    background: var(--color-ink); color: var(--color-cream); padding: 0.6rem 1.1rem;
    border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--color-brick-deep); }
  .hidden { display: none !important; }
  #loading { text-align: center; padding: 3rem 0; color: var(--text-muted); }

  /* --- docs / ajuda --- */
  #docs-content h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 1.6rem 0 0.6rem; }
  #docs-content h2:first-child { margin-top: 0; }
  #docs-content h3 { font-family: var(--font-display); font-size: 1rem; margin: 1.2rem 0 0.4rem; }
  #docs-content p { color: var(--text); line-height: 1.55; margin: 0 0 0.6rem; }
  #docs-content code { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; font-size: 0.85em; }
  .field-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.88rem; }
  .field-table th, .field-table td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .field-table th { font-family: var(--font-display); color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .field-table td:first-child code { white-space: nowrap; }
  .field-required { color: var(--brand-primary); font-weight: 700; font-size: 0.75rem; }
  .field-optional { color: var(--text-muted); font-size: 0.75rem; }
  .field-ref {
    background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.9rem 1rem; margin-bottom: 1rem;
  }
  .field-ref .field-table { margin-bottom: 0; }
</style>
</head>
<body>
  <header class="top">
    <h1>bitnikgames CMS</h1>
    <div style="display:flex;gap:0.5rem">
      <button class="btn btn-ghost btn-sm" id="help-btn">? Ajuda</button>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
    </div>
  </header>

  <main>
    <div id="loading">A carregar…</div>

    <div id="list-view" class="hidden">
      <div class="tabs" id="collection-tabs"></div>
      <div class="list-head">
        <span id="list-count" class="text-muted"></span>
        <button class="btn btn-primary btn-sm" id="new-btn">+ Novo</button>
      </div>
      <div id="entries"></div>
    </div>

    <div id="editor-view" class="hidden">
      <button class="btn btn-ghost btn-sm" id="back-btn" style="margin-bottom:1rem">&larr; Voltar à lista</button>
      <div class="slug-row">
        <label for="slug-input" style="font-family:var(--font-display);font-weight:700">Slug</label>
        <input id="slug-input" type="text" placeholder="nome-do-jogo">
        <span class="text-muted" style="font-size:0.8rem">letras minúsculas, números e hífens</span>
      </div>
      <div class="featured-row hidden" id="featured-row">
        <input type="checkbox" id="featured-checkbox">
        <label for="featured-checkbox">★ Destacar na homepage</label>
      </div>
      <button class="btn btn-ghost btn-sm" id="field-ref-toggle" style="margin-bottom:0.8rem">📖 Ver campos desta coleção</button>
      <div id="field-ref" class="field-ref hidden"></div>
      <div class="editor-panes">
        <div class="pane">
          <label>Português (pt)</label>
          <textarea id="pt-content" spellcheck="false"></textarea>
        </div>
        <div class="pane">
          <label>English (en)</label>
          <textarea id="en-content" spellcheck="false"></textarea>
        </div>
      </div>
      <div class="editor-actions">
        <button class="btn btn-primary" id="save-btn">Guardar</button>
        <button class="btn btn-ghost" id="delete-btn">Eliminar</button>
      </div>
    </div>

    <div id="docs-view" class="hidden">
      <button class="btn btn-ghost btn-sm" id="docs-back-btn" style="margin-bottom:1rem">&larr; Voltar</button>
      <div id="docs-content"></div>
    </div>
  </main>

  <div id="toast"></div>

<script>
let COLLECTIONS = null;
let currentCollection = null;
let currentSlug = null; // null while creating a new entry

const el = (id) => document.getElementById(id);

function toast(msg, isErr) {
  const t = el('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  setTimeout(() => { t.className = ''; }, 3200);
}

      { field: 'duration', type: 'número (minutos)', required: false, desc: '' },

const STATUS_DOCS = [

const GENERAL_DOCS = [

    title: 'pt + en sempre em par',

      '<p>Independentemente de teres ou não <code>externalUrl</code>, o campo <code>ctaLabel</code> muda o texto do botão principal — funciona no link externo, no "Comprar"/"Descarregar" normal, e até nos placeholders desativados ("Brevemente", checkout por vir). Deixa em branco para usar sempre o texto por omissão.</p>',

function fieldTable(rows, hideRequiredCol) {
  return '<table class="field-table"><thead><tr><th>Campo</th><th>' + (hideRequiredCol ? 'Badge' : 'Tipo') + '</th>' +
    (hideRequiredCol ? '' : '<th></th>') +
    '<th>Descrição</th></tr></thead><tbody>' +
    rows.map((r) => (
      '<tr><td><code>' + r.field + '</code></td><td>' + r.type + '</td>' +
      (hideRequiredCol ? '' : '<td>' + (r.required ? '<span class="field-required">obrigatório</span>' : '<span class="field-optional">opcional</span>') + '</td>') +
      '<td>' + r.desc + '</td></tr>'
    )).join('') +
    '</tbody></table>';
}

function renderDocs() {
  let html = '<h2>Guia rápido</h2>';
  GENERAL_DOCS.forEach((s) => { html += '<h3>' + s.title + '</h3>' + s.html; });
  html += '<h2>Campos por coleção</h2>';
  Object.values(FIELD_DOCS).forEach((c) => {
    html += '<h3>' + c.label + '</h3>' + fieldTable(c.fields);
  });
  el('docs-content').innerHTML = html;
}

function showDocs() {
  renderDocs();
  el('list-view').classList.add('hidden');
  el('editor-view').classList.add('hidden');
  el('docs-view').classList.remove('hidden');
}

// Not a real YAML parser — same deliberate scope as the server-side
// validator, just for the one `featured: true|false` line. Keeping this
// as a tiny read/replace pair (instead of round-tripping through the API)
// means toggling the checkbox has no extra request, and the value only
// gets spliced into the raw text right before Guardar sends it.
function readFeatured(text) {
  const m = text.match(/^featured:\s*(true|false)/m);
  return m ? m[1] === 'true' : false;
}
function writeFeatured(text, value) {
  const line = 'featured: ' + value;
  if (/^featured:\s*(true|false)/m.test(text)) {
    return text.replace(/^featured:\s*(true|false)/m, line);
  }
  // No existing line (older entry from before this field existed) —
  // insert right after the opening --- so it still lands inside the
  // frontmatter block instead of the body text.
  return text.replace(/^---\r?\n/, '---\n' + line + '\n');
}

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    window.location.href = '/index.html';
    throw new Error('Sessão expirada.');
  }
  if (!res.ok) throw new Error(data.error || 'Erro desconhecido.');
  return data;
}

async function checkSession() {
  const { authenticated } = await api('/api/session');
  if (!authenticated) { window.location.href = '/index.html'; return false; }
  return true;
}

async function loadCollections() {
  COLLECTIONS = await api('/api/collections');
  const tabsEl = el('collection-tabs');
  tabsEl.innerHTML = '';
  Object.entries(COLLECTIONS).forEach(([key, c], i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = c.label;
    btn.onclick = () => selectCollection(key);
    btn.dataset.key = key;
    tabsEl.appendChild(btn);
  });
  const firstKey = Object.keys(COLLECTIONS)[0];
  if (firstKey) selectCollection(firstKey);
}

function selectCollection(key) {
  currentCollection = key;
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.key === key));
  renderEntries();
}

let dragSlug = null; // slug currently being dragged, or null

function renderEntries() {
  const c = COLLECTIONS[currentCollection];
  el('list-count').textContent = c.entries.length + (c.entries.length === 1 ? ' entrada' : ' entradas');
  const wrap = el('entries');
  wrap.innerHTML = '';

  if (c.supportsOrder && c.entries.length > 1) {
    const hint = document.createElement('p');
    hint.className = 'order-hint';
    hint.textContent = '⠿ Arrasta para mudar a ordem no site (jogos destacados na homepage seguem esta ordem).';
    wrap.appendChild(hint);
  }

  if (c.entries.length === 0) {
    wrap.innerHTML += '<p class="text-muted">Ainda não há nada aqui.</p>';
  }

  c.entries.forEach((entry) => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.dataset.slug = entry.slug;
    row.innerHTML =
      (c.supportsOrder ? '<span class="drag-handle">⠿</span>' : '') +
      '<span class="slug">' + entry.title + '<small>' + entry.slug + '</small></span>' +
      (entry.featured ? '<span class="featured-badge">★ destacado</span>' : '') +
      (entry.hasEn ? '' : '<span class="warn-badge">falta EN</span>') +
      '<button class="btn btn-ghost btn-sm">Editar</button>';
    row.querySelector('button').onclick = () => openEditor(entry.slug);

    if (c.supportsOrder) {
      row.draggable = true;
      row.addEventListener('dragstart', () => {
        dragSlug = entry.slug;
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        dragSlug = null;
        saveOrder();
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!dragSlug || dragSlug === entry.slug) return;
        const draggedRow = wrap.querySelector('[data-slug="' + CSS.escape(dragSlug) + '"]');
        if (!draggedRow) return;
        // Move the actual dragged element via insertBefore instead of
        // re-rendering the list — replacing DOM nodes mid-drag breaks the
        // native HTML5 drag gesture (the browser loses track of the node
        // that started the drag).
        const rect = row.getBoundingClientRect();
        const before = e.clientY - rect.top < rect.height / 2;
        wrap.insertBefore(draggedRow, before ? row : row.nextSibling);
      });
    }

    wrap.appendChild(row);
  });
  el('list-view').classList.remove('hidden');
  el('editor-view').classList.add('hidden');
}

// Reads the current DOM order (already live-updated by the dragover
// handler above) and persists it as the new order:0,1,2... for every
// entry in this collection.
async function saveOrder() {
  const c = COLLECTIONS[currentCollection];
  if (!c.supportsOrder) return;
  const domSlugs = [...el('entries').querySelectorAll('.entry-row')].map((r) => r.dataset.slug);
  const before = c.entries.map((e) => e.slug);
  if (domSlugs.join(',') === before.join(',')) return; // nothing actually moved

  try {
    await api('/api/reorder', {
      method: 'POST',
      body: JSON.stringify({ collection: currentCollection, slugs: domSlugs }),
    });
    toast('Ordem guardada.');
    await refreshCurrentCollection();
    renderEntries();
  } catch (err) {
    toast(err.message, true);
    renderEntries(); // revert the optimistic DOM move on failure
  }
}

async function openEditor(slug) {
  currentSlug = slug;
  el('slug-input').value = slug || '';
  el('slug-input').disabled = Boolean(slug);
  el('delete-btn').classList.toggle('hidden', !slug);

  // For a brand new entry there's no real slug yet — ask the server for
  // the template anyway using a throwaway placeholder slug (the entry
  // doesn't exist, so /api/entry's GET already falls back to
  // collection.template() for exactly this case). Pre-filling with a
  // real, schema-valid template instead of a blank textarea is what
  // stops a quick "just testing the button" save from writing invalid
  // frontmatter straight into the live site.
  const fetchSlug = slug || 'novo-slug';
  const data = await api('/api/entry?collection=' + currentCollection + '&slug=' + encodeURIComponent(fetchSlug));
  el('pt-content').value = data.pt;
  el('en-content').value = data.en;

  // Featured is one field, but it lives inside both language files —
  // the checkbox controls both together rather than editing the raw
  // frontmatter twice for what's really one decision.
  const supportsFeatured = Boolean(COLLECTIONS[currentCollection].supportsFeatured);
  el('featured-row').classList.toggle('hidden', !supportsFeatured);
  el('featured-checkbox').checked = supportsFeatured && readFeatured(data.pt);

  // Referência de campos fecha-se sempre ao (re)abrir o editor — para não
  // ficar a ocupar espaço se quem edita já sabe o que está a fazer.
  const ref = FIELD_DOCS[currentCollection];
  el('field-ref').innerHTML = ref ? fieldTable(ref.fields) : '';
  el('field-ref').classList.add('hidden');
  el('field-ref-toggle').textContent = '📖 Ver campos desta coleção';
  el('field-ref-toggle').classList.toggle('hidden', !ref);

  el('list-view').classList.add('hidden');
  el('editor-view').classList.remove('hidden');
}

el('new-btn').onclick = () => openEditor(null);
el('back-btn').onclick = () => renderEntries();

el('field-ref-toggle').onclick = () => {
  const nowHidden = el('field-ref').classList.toggle('hidden');
  el('field-ref-toggle').textContent = nowHidden ? '📖 Ver campos desta coleção' : '📖 Esconder campos desta coleção';
};

el('help-btn').onclick = showDocs;
el('docs-back-btn').onclick = () => {
  el('docs-view').classList.add('hidden');
  if (COLLECTIONS && currentCollection) renderEntries();
  else el('list-view').classList.remove('hidden');
};

el('save-btn').onclick = async () => {
  const slug = el('slug-input').value.trim();
  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) {
    toast('Slug inválido — só letras minúsculas, números e hífens.', true);
    return;
  }
  let pt = el('pt-content').value;
  let en = el('en-content').value;
  if (!pt.trim() || !en.trim()) {
    toast('Precisa de conteúdo em pt e en.', true);
    return;
  }
  if (COLLECTIONS[currentCollection].supportsFeatured) {
    const featured = el('featured-checkbox').checked;
    pt = writeFeatured(pt, featured);
    en = writeFeatured(en, featured);
  }
  el('save-btn').disabled = true;
  el('save-btn').textContent = 'A guardar…';
  try {
    await api('/api/entry', {
      method: 'PUT',
      body: JSON.stringify({ collection: currentCollection, slug, pt, en }),
    });
    toast('Guardado. O site vai fazer redeploy automaticamente.');
    await refreshCurrentCollection();
    renderEntries();
  } catch (err) {
    toast(err.message, true);
  } finally {
    el('save-btn').disabled = false;
    el('save-btn').textContent = 'Guardar';
  }
};

el('delete-btn').onclick = async () => {
  if (!currentSlug) return;
  if (!confirm('Eliminar "' + currentSlug + '" (pt + en)? Não há undo.')) return;
  try {
    await api('/api/entry?collection=' + currentCollection + '&slug=' + encodeURIComponent(currentSlug), {
      method: 'DELETE',
    });
    toast('Eliminado.');
    await refreshCurrentCollection();
    renderEntries();
  } catch (err) {
    toast(err.message, true);
  }
};

async function refreshCurrentCollection() {
  const fresh = await api('/api/collections');
  COLLECTIONS = fresh;
}

el('logout-btn').onclick = async () => {
  await api('/api/logout', { method: 'POST' });
  window.location.href = '/index.html';
};

(async () => {
  const ok = await checkSession();
  if (!ok) return;
  await loadCollections();
  el('loading').classList.add('hidden');
})().catch((err) => {
  el('loading').textContent = 'Erro: ' + err.message;
});
</script>
</body>
</html>
