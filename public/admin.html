<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bitnikgames CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dferreiramarques/bitnikgames-design-system@main/src/index.css">
<style>
  body { padding: 0; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
    background: var(--color-white);
  }
  header.top h1 { font-family: var(--font-display); font-size: 1.15rem; }
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }

  .tabs { display: flex; gap: 0.4rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .tab-btn {
    font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
    padding: 0.5rem 1rem; border-radius: var(--radius-pill);
    border: 1.5px solid var(--border); background: var(--color-white); color: var(--text-muted);
    cursor: pointer;
  }
  .tab-btn.active { background: var(--brand-primary); border-color: var(--brand-primary); color: var(--color-white); }

  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
  .deploy-lock { pointer-events: none; opacity: 0.55; }

  .status-light {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 150;
    display: flex; align-items: center; gap: 0.5rem;
    background: var(--color-white); border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 0.45rem 0.9rem 0.45rem 0.6rem; font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
    box-shadow: 0 2px 10px rgba(43, 27, 18, 0.12);
  }
  .status-dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; flex-shrink: 0; background: #2fa84f; }
  .status-light.state-saving .status-dot { background: #e8a93a; }
  .status-light.state-deploying .status-dot { background: #d6473f; animation: status-pulse 1.1s ease-in-out infinite; }
  @keyframes status-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .entry-row {
    display: flex; align-items: center; gap: 0.8rem;
    background: var(--color-white); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.7rem 1rem; margin-bottom: 0.5rem;
  }
  .entry-row .slug { font-family: var(--font-display); font-weight: 600; flex: 1; }
  .entry-row .slug small { display: block; font-family: var(--font-body); font-weight: 400; color: var(--text-muted); font-size: 0.78rem; }
  .warn-badge { color: var(--color-brick-deep); font-size: 0.75rem; font-weight: 600; }
  .featured-badge { color: var(--brand-primary); font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
  .draft-badge { color: var(--text-muted); font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
  .entry-row[draggable="true"] { cursor: grab; }
  .entry-row.dragging { opacity: 0.4; }
  .drag-handle { color: var(--text-muted); font-size: 1.1rem; line-height: 1; cursor: grab; flex-shrink: 0; }
  .order-hint { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.6rem; }

  .toggle-rows { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }

  .featured-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.9rem; background: var(--bg-alt); border: 1px solid var(--border);
    border-radius: var(--radius-sm); width: fit-content;
  }
  .featured-row label { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; cursor: pointer; }
  .featured-row input { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: var(--brand-primary); }

  .draft-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.9rem; background: var(--bg-alt); border: 1px solid var(--border);
    border-radius: var(--radius-sm); width: fit-content;
  }
  .draft-row label { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; cursor: pointer; }
  .draft-row input { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: var(--text-muted); }

  .editor-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  @media (max-width: 720px) { .editor-panes { grid-template-columns: 1fr; } }
  .pane label { display: block; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; margin-bottom: 0.4rem; }
  .pane textarea {
    width: 100%; min-height: 420px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 0.82rem; line-height: 1.5; padding: 0.8rem; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg-alt); color: var(--text); resize: vertical;
  }
  .editor-actions { display: flex; gap: 0.6rem; align-items: center; }
  .slug-row { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .slug-row input {
    padding: 0.6rem 0.8rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-family: var(--font-body); background: var(--color-white); min-width: 240px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
    background: var(--color-ink); color: var(--color-cream); padding: 0.6rem 1.1rem;
    border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--color-brick-deep); }
  .hidden { display: none !important; }
  #loading { text-align: center; padding: 3rem 0; color: var(--text-muted); }

  /* --- docs / ajuda: modal por cima da lista/editor, não os substitui --- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(43, 27, 18, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; z-index: 200;
  }
  .modal-panel {
    background: var(--color-white); border-radius: var(--radius-lg);
    max-width: 720px; width: 100%; max-height: 85vh; overflow-y: auto;
    padding: 1.5rem 1.75rem; box-shadow: var(--shadow-card-hover);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem;
  }
  .modal-header h2 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; }
  #docs-content h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 1.6rem 0 0.6rem; }
  #docs-content h2:first-child { margin-top: 0; }
  #docs-content h3 { font-family: var(--font-display); font-size: 1rem; margin: 1.2rem 0 0.4rem; }
  #docs-content p { color: var(--text); line-height: 1.55; margin: 0 0 0.6rem; }
  #docs-content code { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; font-size: 0.85em; }
  .field-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.88rem; }
  .field-table th, .field-table td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .field-table th { font-family: var(--font-display); color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .field-table td:first-child code { white-space: nowrap; }
  .field-required { color: var(--brand-primary); font-weight: 700; font-size: 0.75rem; }
  .field-optional { color: var(--text-muted); font-size: 0.75rem; }
  .field-ref {
    background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.9rem 1rem; margin-bottom: 1rem;
  }
  .field-ref .field-table { margin-bottom: 0; }
</style>
</head>
<body>
  <header class="top">
    <h1>bitnikgames CMS</h1>
    <div style="display:flex;gap:0.5rem">
      <button class="btn btn-ghost btn-sm" id="help-btn">? Ajuda</button>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
    </div>
  </header>

  <main>
    <div id="loading">A carregar…</div>

    <div id="list-view" class="hidden">
      <div class="tabs" id="collection-tabs"></div>
      <div class="list-head">
        <span id="list-count" class="text-muted"></span>
        <button class="btn btn-primary btn-sm" id="new-btn">+ Novo</button>
      </div>
      <div id="entries"></div>
    </div>

    <div id="editor-view" class="hidden">
      <button class="btn btn-ghost btn-sm" id="back-btn" style="margin-bottom:1rem">&larr; Voltar à lista</button>
      <div class="slug-row">
        <label for="slug-input" style="font-family:var(--font-display);font-weight:700">Slug</label>
        <input id="slug-input" type="text" placeholder="nome-do-jogo">
        <span class="text-muted" style="font-size:0.8rem">letras minúsculas, números e hífens</span>
        <span class="text-muted rename-hint hidden" id="rename-hint" style="font-size:0.8rem">⚠️ Mudar isto muda o URL da página — quem tiver o link antigo passa a dar 404.</span>
      </div>
      <div class="toggle-rows">
        <div class="featured-row hidden" id="featured-row">
          <input type="checkbox" id="featured-checkbox">
          <label for="featured-checkbox">★ Destacar na homepage</label>
        </div>
        <div class="draft-row hidden" id="draft-row">
          <input type="checkbox" id="draft-checkbox">
          <label for="draft-checkbox">📝 Rascunho (não publicar no site)</label>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="field-ref-toggle" style="margin-bottom:0.8rem">📖 Ver campos desta coleção</button>
      <div id="field-ref" class="field-ref hidden"></div>
      <div class="editor-panes">
        <div class="pane">
          <label>Português (pt)</label>
          <textarea id="pt-content" spellcheck="false"></textarea>
        </div>
        <div class="pane">
          <label>English (en)</label>
          <textarea id="en-content" spellcheck="false"></textarea>
        </div>
      </div>
      <div class="editor-actions">
        <button class="btn btn-primary" id="save-btn">Guardar</button>
        <button class="btn btn-ghost" id="delete-btn">Eliminar</button>
      </div>
    </div>

  </main>

  <div id="docs-modal" class="modal-backdrop hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>Ajuda</h2>
        <button class="btn btn-ghost btn-sm" id="docs-close-btn">✕</button>
      </div>
      <div id="docs-content"></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="status-light" class="status-light state-idle" title="Estado da ligação ao GitHub/Vercel">
    <span class="status-dot"></span>
    <span id="status-label">Tudo ok</span>
  </div>

<script>
let COLLECTIONS = null;
let currentCollection = null;
let currentSlug = null; // null while creating a new entry

const el = (id) => document.getElementById(id);

function toast(msg, isErr) {
  const t = el('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  setTimeout(() => { t.className = ''; }, 3200);
}

// Referência de campos — puramente informativa, não deriva do schema real
// (api/_lib/collections.js só sabe quais campos são *obrigatórios*, não o
// que cada um significa). Se o schema em bitnikgames/src/content/config.ts
// mudar, isto tem de ser atualizado à mão.
const FIELD_DOCS = {

      { field: 'age', type: 'número', required: false, desc: 'Idade mínima recomendada.' },
      { field: 'status', type: 'ver "Status e badges"', required: true, desc: 'buy-now, buy-external, coming-soon, free, paid ou pwyw.' },
      { field: 'price', type: 'texto', required: false, desc: 'Ex.: "18€". Só é mostrado com status buy-now ou paid.' },
      { field: 'externalUrl', type: 'URL', required: false, desc: 'Link do botão principal para outra plataforma (Stripe, itch.io…). Obrigatório se status="buy-external". Ver "Links externos / CTA".' },
      { field: 'ctaLabel', type: 'texto', required: false, desc: 'Texto do botão principal, seja qual for o estado (link externo, "Comprar", placeholder desativado, "Brevemente"…). Sem isto, usa o texto por omissão de cada estado. Ver "Links externos / CTA".' },
      { field: 'video', type: 'URL do YouTube', required: false, desc: 'Trailer do jogo (watch?v=, youtu.be/ ou /shorts/ — qualquer formato). Sem videoEmbed:true, aparece só como link "Ver trailer" a seguir à descrição.' },
      { field: 'videoEmbed', type: 'true/false', required: false, desc: 'Com video preenchido e isto a true, o player fica embutido a seguir à descrição em vez de aparecer só como link. Por omissão: false.' },
      { field: 'tags', type: 'lista de texto', required: false, desc: 'Ex.: ["blefe", "apostas"]. Por omissão: lista vazia.' },
      { field: 'featured', type: 'true/false', required: false, desc: 'Mostra na homepage. Por omissão: false.' },
      { field: 'order', type: 'número', required: false, desc: 'Ordem manual — normalmente não se edita à mão, arrasta-se ⠿ na lista.' },
      { field: 'publishedDate', type: 'data AAAA-MM-DD', required: true, desc: '' },
      { field: 'draft', type: 'true/false', required: false, desc: 'Com true, a entrada fica só guardada aqui — sem página nem link no site. Por omissão: false.' },
    ],
  },
  pnp: {
    label: 'Print & Play',
    fields: [
      { field: 'title', type: 'texto', required: true, desc: 'Nome do PnP.' },
      { field: 'shortDescription', type: 'texto', required: true, desc: 'Frase curta no cartão e no topo da página.' },
      { field: 'players', type: '{ min, max }', required: false, desc: '' },
      { field: 'duration', type: 'número (minutos)', required: false, desc: '' },
      { field: 'age', type: 'número', required: false, desc: 'Idade mínima recomendada.' },
      { field: 'status', type: 'ver "Status e badges"', required: true, desc: 'Normalmente free, paid ou pwyw — mas nada impede coming-soon, etc.' },
      { field: 'price', type: 'texto', required: false, desc: 'Ex.: "2€". Mostrado com status paid.' },
      { field: 'fileUrl', type: 'URL', required: false, desc: 'Link direto do PDF. Ver "Ficheiros de Print & Play". Por omissão: "#" (botão desativado).' },
      { field: 'externalUrl', type: 'URL', required: false, desc: 'Link do botão principal para o itch.io ou outra plataforma, em vez de download direto. Tem prioridade sobre fileUrl. Ver "Links externos / CTA".' },
      { field: 'ctaLabel', type: 'texto', required: false, desc: 'Texto do botão principal, seja qual for o estado (link externo, "Descarregar", placeholder desativado…). Sem isto, usa o texto por omissão de cada estado. Ver "Links externos / CTA".' },
      { field: 'tags', type: 'lista de texto', required: false, desc: '' },
      { field: 'featured', type: 'true/false', required: false, desc: 'Mostra na homepage.' },
      { field: 'order', type: 'número', required: false, desc: 'Arrasta ⠿ na lista para mudar.' },
      { field: 'publishedDate', type: 'data AAAA-MM-DD', required: true, desc: '' },
      { field: 'draft', type: 'true/false', required: false, desc: 'Com true, a entrada fica só guardada aqui — sem página nem link no site. Por omissão: false.' },
    ],
  },
  posts: {
    label: 'Blog',
    fields: [
      { field: 'title', type: 'texto', required: true, desc: '' },
      { field: 'excerpt', type: 'texto', required: true, desc: 'Resumo curto mostrado na lista do blog.' },
      { field: 'readingMinutes', type: 'número', required: false, desc: 'Por omissão: 4.' },
      { field: 'tags', type: 'lista de texto', required: false, desc: '' },
      { field: 'featured', type: 'true/false', required: false, desc: 'Mostra na homepage.' },
      { field: 'order', type: 'número', required: false, desc: 'Arrasta ⠿ na lista para mudar.' },
      { field: 'publishedDate', type: 'data AAAA-MM-DD', required: true, desc: '' },
      { field: 'draft', type: 'true/false', required: false, desc: 'Com true, a entrada fica só guardada aqui — sem página nem link no site. Por omissão: false.' },

  playOnline: {
    label: 'Jogar Online',
    fields: [

      { field: 'description', type: 'texto', required: true, desc: 'Frase curta no cartão.' },

  },
  hero: {
    label: 'Hero (Home)',
    fields: [
      { field: 'title', type: 'texto', required: true, desc: 'O título grande (H1) do hero da homepage.' },

  },

const STATUS_DOCS = [
  { field: 'buy-now', type: 'badge "Comprar"', required: false, desc: 'Jogo físico à venda. Com <code>externalUrl</code> preenchido, o botão aponta para lá (Stripe, itch.io…); sem ele, fica um placeholder desativado.' },
  { field: 'buy-external', type: 'badge "Disponível externamente"', required: false, desc: 'Não se vende no site — aponta sempre para <code>externalUrl</code> (obrigatório com este status).' },
  { field: 'coming-soon', type: 'badge "Brevemente"', required: false, desc: 'Sem botão clicável.' },
  { field: 'free', type: 'badge "Grátis"', required: false, desc: 'Normalmente em Print & Play.' },
  { field: 'paid', type: 'badge "Pago"', required: false, desc: 'Normalmente em Print & Play — mostra o <code>price</code>.' },
  { field: 'pwyw', type: 'badge "Paga o que quiseres"', required: false, desc: 'Normalmente em Print & Play.' },
];

const GENERAL_DOCS = [
  {
    title: 'pt + en sempre em par',
    html:
      '<p>Cada jogo, PnP ou post existe em dois ficheiros com o mesmo slug — um em pt, outro em en. Este editor obriga a preencheres os dois de cada vez que gravas. Nunca deixes um em branco "para resolver depois": isso parte o seletor de idioma nessa página no site. Se só tens o texto num idioma, escreve os dois na mesma (mesmo que um fique por traduzir) e ajusta depois.</p>',
  },
  {
    title: 'Imagens',
    html:
      '<p>Este CMS não faz upload de imagens. A capa de um jogo, PnP ou post vem de <code>public/cards/&lt;slug&gt;.png</code> no repositório do site — se esse ficheiro não existir, o site mostra um gradiente com o título em vez de arte. Para adicionar uma capa, é preciso um commit direto ao repositório <code>bitnikgames</code> (arrastar o ficheiro no GitHub, por exemplo).</p>' +
      '<p>Para imagens dentro do texto (a seguir ao <code>---</code> final do frontmatter, tanto em posts como em jogos/PnP), usa markdown normal — não precisas de nenhum código especial: <code>![texto alternativo](https://dominio.com/imagem.jpg)</code>. Funciona com qualquer URL de imagem já publicada noutro sítio (não há upload aqui).</p>',
  },
  {
    title: 'Ficheiros de Print & Play',
    html:
      '<p>Os PDFs não vivem no site nem neste CMS — publicam-se como asset de uma release no GitHub (release <code>pnp-files</code> do repositório bitnikgames). Depois de fazeres upload do PDF lá, copia o link do asset para o campo <code>fileUrl</code> desta entrada. Enquanto <code>fileUrl</code> for "#", o botão "Descarregar" no site fica desativado.</p>',
  },
  { title: 'Status e badges', html: '<p>O campo <code>status</code> é o mesmo em jogos e em Print & Play (de propósito, para poderes copiar frontmatter de um para o outro sem editar nomes de campos) — cada coleção normalmente só usa o subconjunto que faz sentido:</p>' + fieldTable(STATUS_DOCS, true) },
  {
    title: 'Links externos / CTA',
    html:
      '<p>Preenchendo <code>externalUrl</code> em qualquer jogo ou PnP, o botão principal da página passa a apontar diretamente para lá — uma página no itch.io, um Payment Link do Stripe, o Gumroad, ou qualquer outra plataforma de venda. Sem checkout próprio no site, isto é a forma de vender já hoje: cria o produto na plataforma que preferires e cola o link aqui.</p>' +
      '<p>Independentemente de teres ou não <code>externalUrl</code>, o campo <code>ctaLabel</code> muda o texto do botão principal — funciona no link externo, no "Comprar"/"Descarregar" normal, e até nos placeholders desativados ("Brevemente", checkout por vir). Deixa em branco para usar sempre o texto por omissão.</p>',
  },
  {

function fieldTable(rows, hideRequiredCol) {
  return '<table class="field-table"><thead><tr><th>Campo</th><th>' + (hideRequiredCol ? 'Badge' : 'Tipo') + '</th>' +
    (hideRequiredCol ? '' : '<th></th>') +
    '<th>Descrição</th></tr></thead><tbody>' +
    rows.map((r) => (
      '<tr><td><code>' + r.field + '</code></td><td>' + r.type + '</td>' +
      (hideRequiredCol ? '' : '<td>' + (r.required ? '<span class="field-required">obrigatório</span>' : '<span class="field-optional">opcional</span>') + '</td>') +
      '<td>' + r.desc + '</td></tr>'
    )).join('') +
    '</tbody></table>';
}

function renderDocs() {
  let html = '<h2>Guia rápido</h2>';
  GENERAL_DOCS.forEach((s) => { html += '<h3>' + s.title + '</h3>' + s.html; });
  html += '<h2>Campos por coleção</h2>';
  Object.values(FIELD_DOCS).forEach((c) => {
    html += '<h3>' + c.label + '</h3>' + fieldTable(c.fields);
  });
  el('docs-content').innerHTML = html;
}

// Modal por cima da lista/editor — nunca esconde/troca a view de trás, para
// não perder o que estava lá (um textarea a meio de edição, por exemplo).
function showDocs() {
  renderDocs();
  el('docs-modal').classList.remove('hidden');
}
function hideDocs() {
  el('docs-modal').classList.add('hidden');
}

// Not a real YAML parser — same deliberate scope as the server-side
// validator, just for the one `featured: true|false` line. Keeping this
// as a tiny read/replace pair (instead of round-tripping through the API)
// means toggling the checkbox has no extra request, and the value only
// gets spliced into the raw text right before Guardar sends it.
function readFeatured(text) {
  const m = text.match(/^featured:\s*(true|false)/m);
  return m ? m[1] === 'true' : false;
}
function writeFeatured(text, value) {
  const line = 'featured: ' + value;
  if (/^featured:\s*(true|false)/m.test(text)) {
    return text.replace(/^featured:\s*(true|false)/m, line);
  }
  // No existing line (older entry from before this field existed) —
  // insert right after the opening --- so it still lands inside the
  // frontmatter block instead of the body text.
  return text.replace(/^---\r?\n/, '---\n' + line + '\n');
}

// Same narrow read/replace approach as featured, for the "Rascunho"
// checkbox — draft:true keeps an entry saved here but out of every
// listing/detail page on the site (see getPublished() in the site repo).
function readDraft(text) {
  const m = text.match(/^draft:\s*(true|false)/m);
  return m ? m[1] === 'true' : false;
}
function writeDraft(text, value) {
  const line = 'draft: ' + value;
  if (/^draft:\s*(true|false)/m.test(text)) {
    return text.replace(/^draft:\s*(true|false)/m, line);
  }
  return text.replace(/^---\r?\n/, '---\n' + line + '\n');
}

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    window.location.href = '/index.html';
    throw new Error('Sessão expirada.');
  }
  if (!res.ok) throw new Error(data.error || 'Erro desconhecido.');
  return data;
}

async function checkSession() {
  const { authenticated } = await api('/api/session');
  if (!authenticated) { window.location.href = '/index.html'; return false; }
  return true;
}

async function loadCollections() {
  COLLECTIONS = await api('/api/collections');
  const tabsEl = el('collection-tabs');
  tabsEl.innerHTML = '';
  Object.entries(COLLECTIONS).forEach(([key, c], i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = c.label;
    btn.onclick = () => selectCollection(key);
    btn.dataset.key = key;
    tabsEl.appendChild(btn);
  });
  const firstKey = Object.keys(COLLECTIONS)[0];
  if (firstKey) selectCollection(firstKey);
}

function selectCollection(key) {
  currentCollection = key;
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.key === key));
  renderEntries();
}

let dragSlug = null; // slug currently being dragged, or null

// Cada gravação faz commit direto ao GitHub, que dispara um deploy no
// Vercel. Um semáforo fixo no canto do ecrã (ver #status-light) mostra em
// que fase disso estamos — verde/idle (destrancado), amarelo/saving (a
// escrever no GitHub) ou vermelho/deploying (a aguardar o Vercel terminar) —
// e o mesmo estado bloqueia a lista, para quem edita não pensar que "não
// funcionou" e voltar a mexer a meio de um deploy em curso.
let statusState = 'idle';

function applyStatusUI() {
  const active = statusState !== 'idle';
  el('status-light').className = 'status-light state-' + statusState;
  el('entries').classList.toggle('deploy-lock', active);
  el('new-btn').disabled = active;
}

function setStatus(state, label) {
  statusState = state;
  el('status-label').textContent = label;
  applyStatusUI();
}

function setIdle() {
  setStatus('idle', 'Tudo ok');
}

// Fallback usado quando não dá para saber o estado real do deploy (ver
// waitForDeploy) — uma espera fixa, só para não deixar a UI destrancada
// logo a seguir a gravar.
const FALLBACK_WAIT_SECONDS = 20;
function waitFixed(seconds) {
  let remaining = seconds;
  const tick = () => {
    if (remaining <= 0) {
      setIdle();
      return;
    }
    setStatus('deploying', 'A processar deploy… (~' + remaining + 's)');
    remaining--;
    setTimeout(tick, 1000);
  };
  tick();
}

// Poll a /api/deploy-status com o sha do commit que a gravação acabou de
// produzir, até o Vercel reportar esse deploy como pronto (ou falhado, ou
// até desistir ao fim de DEPLOY_POLL_TIMEOUT_MS — nunca fica trancado para
// sempre). Se o endpoint falhar de todo (VERCEL_TOKEN/VERCEL_PROJECT_ID
// ainda não configurados no Vercel, por exemplo), cai para waitFixed em vez
// de tentar para sempre.
const DEPLOY_POLL_INTERVAL_MS = 3000;
const DEPLOY_POLL_TIMEOUT_MS = 180000; // ~3min
async function waitForDeploy(sha) {
  if (!sha) {
    waitFixed(FALLBACK_WAIT_SECONDS);
    return;
  }
  const startedAt = Date.now();
  setStatus('deploying', 'A processar deploy…');
  while (Date.now() - startedAt < DEPLOY_POLL_TIMEOUT_MS) {
    let state;
    try {
      ({ state } = await api('/api/deploy-status?sha=' + encodeURIComponent(sha)));
    } catch {
      waitFixed(FALLBACK_WAIT_SECONDS);
      return;
    }
    if (state === 'READY') {
      setIdle();
      return;
    }
    if (state === 'ERROR' || state === 'CANCELED') {
      setStatus('deploying', 'Deploy falhou — confere o Vercel.');
      setTimeout(setIdle, 4000);
      return;
    }
    // BUILDING, QUEUED, INITIALIZING, PENDING — continua a tentar
    await new Promise((r) => setTimeout(r, DEPLOY_POLL_INTERVAL_MS));
  }
  setIdle(); // desistiu depois do timeout — destranca de qualquer forma
}

function renderEntries() {
  const c = COLLECTIONS[currentCollection];
  el('list-count').textContent = c.entries.length + (c.entries.length === 1 ? ' entrada' : ' entradas');
  const wrap = el('entries');
  wrap.innerHTML = '';

  if (c.supportsOrder && c.entries.length > 1) {
    const hint = document.createElement('p');
    hint.className = 'order-hint';
    hint.textContent = '⠿ Arrasta para mudar a ordem no site (jogos destacados na homepage seguem esta ordem).';
    wrap.appendChild(hint);
  }

  if (c.entries.length === 0) {
    wrap.innerHTML += '<p class="text-muted">Ainda não há nada aqui.</p>';
  }

  c.entries.forEach((entry) => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.dataset.slug = entry.slug;
    row.innerHTML =
      (c.supportsOrder ? '<span class="drag-handle">⠿</span>' : '') +
      '<span class="slug">' + entry.title + '<small>' + entry.slug + '</small></span>' +
      (entry.featured ? '<span class="featured-badge">★ destacado</span>' : '') +
      (entry.draft ? '<span class="draft-badge">📝 rascunho</span>' : '') +
      (entry.hasEn ? '' : '<span class="warn-badge">falta EN</span>') +
      '<button class="btn btn-ghost btn-sm">Editar</button>';
    row.querySelector('button').onclick = () => openEditor(entry.slug);

    if (c.supportsOrder) {
      row.draggable = true;
      row.addEventListener('dragstart', () => {
        dragSlug = entry.slug;
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        dragSlug = null;
        saveOrder();
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!dragSlug || dragSlug === entry.slug) return;
        const draggedRow = wrap.querySelector('[data-slug="' + CSS.escape(dragSlug) + '"]');
        if (!draggedRow) return;
        // Move the actual dragged element via insertBefore instead of
        // re-rendering the list — replacing DOM nodes mid-drag breaks the
        // native HTML5 drag gesture (the browser loses track of the node
        // that started the drag).
        const rect = row.getBoundingClientRect();
        const before = e.clientY - rect.top < rect.height / 2;
        wrap.insertBefore(draggedRow, before ? row : row.nextSibling);
      });
    }

    wrap.appendChild(row);
  });
  el('list-view').classList.remove('hidden');
  el('editor-view').classList.add('hidden');
  applyStatusUI(); // um bloqueio ativo sobrevive à troca de separador/coleção
}

// Reads the current DOM order (already live-updated by the dragover
// handler above) and persists it as the new order:0,1,2... for every
// entry in this collection.
async function saveOrder() {
  if (statusState !== 'idle') return; // #entries já está com pointer-events:none, isto é só defesa extra
  const c = COLLECTIONS[currentCollection];
  if (!c.supportsOrder) return;
  const domSlugs = [...el('entries').querySelectorAll('.entry-row')].map((r) => r.dataset.slug);
  const before = c.entries.map((e) => e.slug);
  if (domSlugs.join(',') === before.join(',')) return; // nothing actually moved

  setStatus('saving', 'A gravar ordem…');
  try {
    const { sha } = await api('/api/reorder', {
      method: 'POST',
      body: JSON.stringify({ collection: currentCollection, slugs: domSlugs }),
    });
    toast('Ordem guardada.');
    await refreshCurrentCollection();
    renderEntries();
    waitForDeploy(sha);
  } catch (err) {
    toast(err.message, true);
    renderEntries(); // revert the optimistic DOM move on failure
    setIdle();
  }
}

async function openEditor(slug) {
  currentSlug = slug;
  el('slug-input').value = slug || '';
  // Coleções singleton (hero, footer) só têm a entrada "home" — trava o
  // slug para não se poder "renomear" a única entrada para outra coisa.
  // Nas outras, editar o slug de uma entrada existente é um rename (ver
  // save-btn abaixo): apaga os ficheiros antigos depois de escrever os
  // novos, para não deixar lixo nem partir o site com duas versões.
  const isSingleton = Boolean(COLLECTIONS[currentCollection].singleton);
  el('slug-input').disabled = Boolean(slug) && isSingleton;
  el('rename-hint').classList.toggle('hidden', !slug || isSingleton);
  el('delete-btn').classList.toggle('hidden', !slug);

  // For a brand new entry there's no real slug yet — ask the server for
  // the template anyway using a throwaway placeholder slug (the entry
  // doesn't exist, so /api/entry's GET already falls back to
  // collection.template() for exactly this case). Pre-filling with a
  // real, schema-valid template instead of a blank textarea is what
  // stops a quick "just testing the button" save from writing invalid
  // frontmatter straight into the live site.
  const fetchSlug = slug || 'novo-slug';
  const data = await api('/api/entry?collection=' + currentCollection + '&slug=' + encodeURIComponent(fetchSlug));
  el('pt-content').value = data.pt;
  el('en-content').value = data.en;

  // Featured is one field, but it lives inside both language files —
  // the checkbox controls both together rather than editing the raw
  // frontmatter twice for what's really one decision.
  const supportsFeatured = Boolean(COLLECTIONS[currentCollection].supportsFeatured);
  el('featured-row').classList.toggle('hidden', !supportsFeatured);
  el('featured-checkbox').checked = supportsFeatured && readFeatured(data.pt);

  const supportsDraft = Boolean(COLLECTIONS[currentCollection].supportsDraft);
  el('draft-row').classList.toggle('hidden', !supportsDraft);
  el('draft-checkbox').checked = supportsDraft && readDraft(data.pt);

  // Referência de campos fecha-se sempre ao (re)abrir o editor — para não
  // ficar a ocupar espaço se quem edita já sabe o que está a fazer.
  const ref = FIELD_DOCS[currentCollection];
  el('field-ref').innerHTML = ref ? fieldTable(ref.fields) : '';
  el('field-ref').classList.add('hidden');
  el('field-ref-toggle').textContent = '📖 Ver campos desta coleção';
  el('field-ref-toggle').classList.toggle('hidden', !ref);

  el('list-view').classList.add('hidden');
  el('editor-view').classList.remove('hidden');
}

el('new-btn').onclick = () => openEditor(null);
el('back-btn').onclick = () => renderEntries();

el('field-ref-toggle').onclick = () => {
  const nowHidden = el('field-ref').classList.toggle('hidden');
  el('field-ref-toggle').textContent = nowHidden ? '📖 Ver campos desta coleção' : '📖 Esconder campos desta coleção';
};

el('help-btn').onclick = showDocs;
el('docs-close-btn').onclick = hideDocs;
el('docs-modal').addEventListener('click', (e) => {
  if (e.target === el('docs-modal')) hideDocs(); // clique fora do painel = fechar
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !el('docs-modal').classList.contains('hidden')) hideDocs();
});

el('save-btn').onclick = async () => {
  const slug = el('slug-input').value.trim();
  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) {
    toast('Slug inválido — só letras minúsculas, números e hífens.', true);
    return;
  }
  let pt = el('pt-content').value;
  let en = el('en-content').value;
  if (!pt.trim() || !en.trim()) {
    toast('Precisa de conteúdo em pt e en.', true);
    return;
  }
  if (COLLECTIONS[currentCollection].supportsFeatured) {
    const featured = el('featured-checkbox').checked;
    pt = writeFeatured(pt, featured);
    en = writeFeatured(en, featured);
  }
  if (COLLECTIONS[currentCollection].supportsDraft) {
    const draft = el('draft-checkbox').checked;
    pt = writeDraft(pt, draft);
    en = writeDraft(en, draft);
  }
  // currentSlug é o slug com que o editor abriu; slug é o que está agora no
  // input. Diferentes = renomear: escreve nos ficheiros novos primeiro, só
  // apaga os antigos depois de confirmar que gravou — para nunca perder
  // conteúdo se o pedido a meio falhar (rede, sessão expirada, etc.).
  const renaming = Boolean(currentSlug) && slug !== currentSlug;

  el('save-btn').disabled = true;
  el('save-btn').textContent = 'A guardar…';
  setStatus('saving', 'A gravar alterações…');
  try {
    if (renaming) {
      const check = await api('/api/entry?collection=' + currentCollection + '&slug=' + encodeURIComponent(slug));
      if (check.exists) {
        throw new Error('Já existe uma entrada com o slug "' + slug + '" nesta coleção.');
      }
    }
    let { sha } = await api('/api/entry', {
      method: 'PUT',
      body: JSON.stringify({ collection: currentCollection, slug, pt, en }),
    });
    if (renaming) {
      ({ sha } = await api('/api/entry?collection=' + currentCollection + '&slug=' + encodeURIComponent(currentSlug), {
        method: 'DELETE',
      }));
      currentSlug = slug;
    }
    toast(renaming ? 'Slug alterado. O site vai fazer redeploy automaticamente.' : 'Guardado. O site vai fazer redeploy automaticamente.');
    await refreshCurrentCollection();
    renderEntries();
    waitForDeploy(sha);
  } catch (err) {
    toast(err.message, true);
    setIdle();
  } finally {
    el('save-btn').disabled = false;
    el('save-btn').textContent = 'Guardar';
  }
};

el('delete-btn').onclick = async () => {
  if (!currentSlug) return;
  if (!confirm('Eliminar "' + currentSlug + '" (pt + en)? Não há undo.')) return;
  setStatus('saving', 'A eliminar…');
  try {
    const { sha } = await api('/api/entry?collection=' + currentCollection + '&slug=' + encodeURIComponent(currentSlug), {
      method: 'DELETE',
    });
    toast('Eliminado.');
    await refreshCurrentCollection();
    renderEntries();
    waitForDeploy(sha);
  } catch (err) {
    toast(err.message, true);
    setIdle();
  }
};

async function refreshCurrentCollection() {
  const fresh = await api('/api/collections');
  COLLECTIONS = fresh;
}

el('logout-btn').onclick = async () => {
  await api('/api/logout', { method: 'POST' });
  window.location.href = '/index.html';
};

(async () => {
  const ok = await checkSession();
  if (!ok) return;
  await loadCollections();
  el('loading').classList.add('hidden');
})().catch((err) => {
  el('loading').textContent = 'Erro: ' + err.message;
});
</script>
</body>
</html>
